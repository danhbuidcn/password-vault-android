build:
  maxIssues: 0

naming:
  FunctionNaming:
    ignoreAnnotated: ["Composable"] # @Composable functions returning Unit are PascalCase by convention

style:
  MagicNumber:
    active: false # revisit once real business logic (crypto params, timeouts) lands
  UnusedPrivateMember:
    ignoreAnnotated: ["Preview"] # @Preview composables are invoked by tooling, not app code
  ReturnCount:
    max: 5 # guard-clause validation (setup/verify flows) reads better than nested single-return

complexity:
  TooManyFunctions:
    thresholdInClasses: 20 # UnlockViewModel owns one StateFlow across 3 unlock methods (password/PIN/biometric);
    # splitting it up would fragment that single source of truth for no real benefit
    thresholdInObjects: 15 # SecurityModule is 1 flat Hilt @Provides list; splitting it adds indirection, not clarity
  LongParameterList:
    constructorThreshold: 8 # UnlockViewModel's constructor is all Hilt-injected singletons, one per
    # security concern (KDF, PIN, biometric, lockout, auto-lock) — grouping them into a synthetic
    # wrapper class would fight Hilt's per-dependency injection convention for no real benefit

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
