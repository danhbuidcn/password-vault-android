build:
  maxIssues: 0

naming:
  FunctionNaming:
    ignoreAnnotated: ["Composable"] # @Composable functions returning Unit are PascalCase by convention

style:
  MagicNumber:
    active: false # revisit once real business logic (crypto params, timeouts) lands
  UnusedPrivateMember:
    ignoreAnnotated: ["Preview"] # @Preview composables are invoked by tooling, not app code
  ReturnCount:
    max: 5 # guard-clause validation (setup/verify flows) reads better than nested single-return

complexity:
  TooManyFunctions:
    thresholdInClasses: 26 # UnlockViewModel owns one StateFlow across 3 unlock methods (password/PIN/biometric),
    # plus verifyMasterPassword (re-auth for Feature 12 export), disablePin/disableBiometric (turning a
    # method off), and onRestoreFilePicked/restoreVault/cancelRestore (restoring a `.pwvbackup` at the
    # pre-unlock Setup screen) — all of which reuse the same private vaultKey/keyDerivation/metadataStore
    # state — splitting it up would fragment that single source of truth for no real benefit
    thresholdInObjects: 16 # SecurityModule is 1 flat Hilt @Provides list; splitting it adds indirection, not clarity
    thresholdInInterfaces: 15 # VaultItemDao owns VaultItem CRUD plus per-item Tag and Custom Field cross-ref
    # queries (clear+insert+set atomically via @Transaction) — both only make sense from the owning
    # VaultItem's perspective, so splitting them into separate DAOs would fragment one atomic-transaction
    # interface for marginal benefit.
  LongParameterList:
    constructorThreshold: 10 # UnlockViewModel's constructor is all Hilt-injected singletons, one per
    # security concern (KDF, PIN, biometric, lockout, auto-lock, backup-reminder-seeding) plus the
    # ApplicationContext needed to open the SAF `Uri` picked for `.pwvbackup` restore — grouping them
    # into a synthetic wrapper class would fight Hilt's per-dependency injection convention for no real
    # benefit
    ignoreAnnotated: ["Composable"] # Compose screens take one callback param per user action by convention;
    # bundling them into a synthetic actions object would add indirection, not clarity
  LongMethod:
    ignoreAnnotated: ["Composable"] # Compose UI trees (list/form/detail screens) are declaratively longer
    # than typical logic functions — that's the normal shape of a Compose screen, not a smell

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
